<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Doodle</title>
<style>
  :root {
    --bg: #ffffff;
    --bar: #f3f3f1;
    --ink: #2b2b2b;
    --muted: #8a8a85;
    --line: #e2e2de;
    --accent: #2f6fde;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg);
    font: 12px -apple-system, BlinkMacSystemFont, sans-serif; color: var(--ink);
    user-select: none; -webkit-user-select: none; }
  #wrap { position: absolute; inset: 0 0 40px 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 40px;
    display: flex; align-items: center; gap: 12px; padding: 0 10px;
    background: var(--bar); border-top: 1px solid var(--line); }
  .group { display: flex; align-items: center; gap: 3px; }
  .sep { width: 1px; height: 20px; background: var(--line); }
  .swatch { width: 18px; height: 18px; margin: 0 2px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer; }
  .swatch.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--bar) inset; }
  .btn { padding: 3px 7px; border-radius: 5px; cursor: pointer; color: var(--ink); white-space: nowrap; }
  .btn:hover { background: var(--line); }
  .btn small { color: var(--muted); font-size: 10px; margin-left: 2px; }
  .btn.on { background: var(--ink); color: #fff; }
  .btn.on small { color: #bbb; }
  #size { width: 18px; text-align: center; color: var(--muted); }
  #send { margin-left: auto; color: var(--muted); }
  #send b { color: var(--ink); font-weight: 600; }
  #hint { position: absolute; top: 14px; left: 16px; color: var(--muted); line-height: 1.6;
    pointer-events: none; transition: opacity .2s; }
  #hint b { color: var(--ink); font-weight: 600; }
  #toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 6px 12px; border-radius: 6px;
    opacity: 0; transition: opacity .15s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #editor { position: absolute; border: 0; outline: 1px dashed var(--accent); padding: 0;
    background: transparent; resize: none; overflow: hidden; white-space: pre;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 500;
    line-height: 1.25; -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hint">
    Draw, then <b>Enter</b> to copy · <b>Esc</b> to cancel<br>
    <b>⌘V</b> or drop a screenshot to draw on it · hold <b>Shift</b> for straight lines and squares<br>
    <b>⌘Z</b> undo · <b>⌫</b> clear · <b>[ ]</b> size · <b>1–5</b> colour
  </div>
</div>
<div id="toast"></div>
<div id="bar">
  <div class="group" id="tools"></div>
  <div class="sep"></div>
  <div class="group"><span class="btn" id="fill">Fill<small>F</small></span></div>
  <div class="sep"></div>
  <div class="group" id="swatches"></div>
  <div class="sep"></div>
  <div class="group"><span>[</span><span id="size"></span><span>]</span></div>
  <div id="send"><b>Enter</b> copy</div>
</div>

<script>
const COLORS = ['#1f1f1f', '#e03131', '#1971c2', '#2f9e44', '#f08c00'];
const SIZES = [2, 4, 7, 12, 20];
const TEXT_SIZES = [14, 18, 24, 32, 44];
const TOOLS = [
  { id: 'pen', name: 'Pen', key: 'P' },
  { id: 'line', name: 'Line', key: 'L' },
  { id: 'arrow', name: 'Arrow', key: 'A' },
  { id: 'rect', name: 'Box', key: 'R' },
  { id: 'ellipse', name: 'Oval', key: 'O' },
  { id: 'text', name: 'Text', key: 'T' },
  { id: 'eraser', name: 'Eraser', key: 'E' },
];
const SHAPES = ['line', 'arrow', 'rect', 'ellipse'];
const BG = '#ffffff';
const PAD = 24;        // px of whitespace kept around the drawing when cropping
const LINE_HEIGHT = 1.25;
const FONT = '500 {px}px -apple-system, BlinkMacSystemFont, sans-serif';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const state = { color: 0, size: 1, tool: 'pen', fill: false, shift: false };
let actions = [];   // strokes, shapes, text, images and clears, replayed on every redraw
let current = null; // stroke or shape being drawn
let editor = null;  // textarea while placing text
let dpr = window.devicePixelRatio || 1;

// ---------- Messaging to Hammerspoon ----------
function post(msg) {
  try { window.webkit.messageHandlers.doodle.postMessage(msg); }
  catch (e) { console.log('no host', msg); }
}

// ---------- Geometry ----------
// Shift snaps lines and arrows to 45° and makes boxes and ovals square.
function shapeEnd(a) {
  if (!a.shift) return { x: a.x1, y: a.y1 };
  const dx = a.x1 - a.x0, dy = a.y1 - a.y0;
  if (a.kind === 'line' || a.kind === 'arrow') {
    const step = Math.PI / 4;
    const ang = Math.round(Math.atan2(dy, dx) / step) * step;
    const len = Math.hypot(dx, dy);
    return { x: a.x0 + len * Math.cos(ang), y: a.y0 + len * Math.sin(ang) };
  }
  const s = Math.max(Math.abs(dx), Math.abs(dy));
  return { x: a.x0 + (dx < 0 ? -s : s), y: a.y0 + (dy < 0 ? -s : s) };
}

function textWidth(a) {
  ctx.save();
  ctx.font = FONT.replace('{px}', a.size);
  const w = Math.max(...a.text.split('\n').map(l => ctx.measureText(l).width));
  ctx.restore();
  return w;
}

function bounds(a) {
  if (a.type === 'stroke') {
    const r = a.size;
    const xs = a.points.map(p => p.x), ys = a.points.map(p => p.y);
    return [Math.min(...xs) - r, Math.min(...ys) - r, Math.max(...xs) + r, Math.max(...ys) + r];
  }
  if (a.type === 'shape') {
    const e = shapeEnd(a);
    const r = a.kind === 'arrow' ? arrowHead(a) : a.size;
    return [Math.min(a.x0, e.x) - r, Math.min(a.y0, e.y) - r, Math.max(a.x0, e.x) + r, Math.max(a.y0, e.y) + r];
  }
  if (a.type === 'text') {
    const lines = a.text.split('\n').length;
    return [a.x, a.y, a.x + textWidth(a), a.y + lines * a.size * LINE_HEIGHT];
  }
  if (a.type === 'image') return [a.x, a.y, a.x + a.w, a.y + a.h];
  return null;
}

// ---------- Rendering ----------
function resize() {
  dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.round(r.width * dpr);
  canvas.height = Math.round(r.height * dpr);
  redraw();
}

function visibleActions() {
  const lastClear = actions.map(a => a.type).lastIndexOf('clear');
  return actions.slice(lastClear + 1);
}

function drawStroke(c, s) {
  const pts = s.points;
  c.strokeStyle = s.tool === 'eraser' ? BG : s.color;
  c.fillStyle = c.strokeStyle;
  if (pts.length === 1) {
    c.beginPath();
    c.arc(pts[0].x, pts[0].y, s.size * pts[0].w / 2, 0, Math.PI * 2);
    c.fill();
    return;
  }
  // Quadratic curves through segment midpoints; per-segment width for pen pressure.
  for (let i = 1; i < pts.length; i++) {
    const p0 = pts[i - 1], p1 = pts[i];
    const m0 = i === 1 ? p0 : { x: (pts[i - 2].x + p0.x) / 2, y: (pts[i - 2].y + p0.y) / 2 };
    const m1 = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
    c.lineWidth = s.size * (p0.w + p1.w) / 2;
    c.beginPath();
    c.moveTo(m0.x, m0.y);
    c.quadraticCurveTo(p0.x, p0.y, m1.x, m1.y);
    if (i === pts.length - 1) c.lineTo(p1.x, p1.y);
    c.stroke();
  }
}

function arrowHead(a) { return Math.max(12, a.size * 4); }

function drawShape(c, a) {
  const { x0, y0 } = a, { x: x1, y: y1 } = shapeEnd(a);
  c.strokeStyle = c.fillStyle = a.color;
  c.lineWidth = a.size;
  c.beginPath();
  if (a.kind === 'line') {
    c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  } else if (a.kind === 'arrow') {
    const h = arrowHead(a), ang = Math.atan2(y1 - y0, x1 - x0), spread = Math.PI / 7;
    // Stop the shaft inside the head so a thick line doesn't poke through the tip.
    const inset = Math.min(h * 0.8, Math.hypot(x1 - x0, y1 - y0));
    c.moveTo(x0, y0);
    c.lineTo(x1 - inset * Math.cos(ang), y1 - inset * Math.sin(ang));
    c.stroke();
    c.beginPath();
    c.moveTo(x1, y1);
    c.lineTo(x1 - h * Math.cos(ang - spread), y1 - h * Math.sin(ang - spread));
    c.lineTo(x1 - h * Math.cos(ang + spread), y1 - h * Math.sin(ang + spread));
    c.closePath();
    c.fill();
  } else if (a.kind === 'rect') {
    c.rect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
    a.fill ? c.fill() : c.stroke();
  } else if (a.kind === 'ellipse') {
    c.ellipse((x0 + x1) / 2, (y0 + y1) / 2, Math.abs(x1 - x0) / 2, Math.abs(y1 - y0) / 2, 0, 0, Math.PI * 2);
    a.fill ? c.fill() : c.stroke();
  }
}

function drawText(c, a) {
  c.fillStyle = a.color;
  c.font = FONT.replace('{px}', a.size);
  c.textBaseline = 'top';
  // Offset by the textarea's half-leading so placed text lands where it was typed.
  const lh = a.size * LINE_HEIGHT, top = a.y + (lh - a.size) / 2;
  a.text.split('\n').forEach((l, i) => c.fillText(l, a.x, top + i * lh));
}

function drawAction(c, a) {
  if (a.type === 'stroke') drawStroke(c, a);
  else if (a.type === 'shape') drawShape(c, a);
  else if (a.type === 'text') drawText(c, a);
  else if (a.type === 'image') c.drawImage(a.img, a.x, a.y, a.w, a.h);
}

function redraw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const vis = visibleActions();
  // Images always sit underneath the drawing, whenever they were pasted.
  vis.filter(a => a.type === 'image').forEach(a => drawAction(ctx, a));
  vis.filter(a => a.type !== 'image').forEach(a => drawAction(ctx, a));
  if (current) drawAction(ctx, current);
  document.getElementById('hint').style.opacity = vis.length || current || editor ? 0 : 1;
}

// ---------- Text ----------
function openEditor(x, y) {
  const size = TEXT_SIZES[state.size];
  editor = document.createElement('textarea');
  editor.id = 'editor';
  Object.assign(editor.style, {
    left: x + 'px', top: y + 'px', fontSize: size + 'px', color: COLORS[state.color],
  });
  editor.dataset.x = x;
  editor.dataset.y = y;
  editor.dataset.size = size;
  editor.dataset.color = COLORS[state.color];
  editor.addEventListener('input', fitEditor);
  editor.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitText(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeEditor(); }
  });
  document.getElementById('wrap').appendChild(editor);
  fitEditor();
  editor.focus();
  redraw();
}

function fitEditor() {
  const size = +editor.dataset.size;
  const w = textWidth({ text: editor.value || ' ', size });
  editor.style.width = Math.max(40, w + size) + 'px';
  editor.style.height = editor.value.split('\n').length * size * LINE_HEIGHT + 'px';
}

function commitText() {
  if (!editor) return;
  const text = editor.value.replace(/\s+$/, '');
  if (text) {
    const d = editor.dataset;
    actions.push({ type: 'text', x: +d.x, y: +d.y, size: +d.size, color: d.color, text });
  }
  closeEditor();
}

function closeEditor() {
  if (!editor) return;
  editor.remove();
  editor = null;
  redraw();
}

// ---------- Images ----------
let lastImageAt = 0;
// Called from the page (paste/drop) and from Hammerspoon (⌘V via the host clipboard).
// Both can fire for one ⌘V, so ignore a second image arriving straight after the first.
function addImage(src) {
  if (Date.now() - lastImageAt < 500) return;
  lastImageAt = Date.now();
  const img = new Image();
  img.onload = () => {
    const W = canvas.width / dpr, H = canvas.height / dpr, m = 20;
    // Screenshots are at retina resolution, so 1/dpr shows them at their on-screen size.
    const scale = Math.min((W - 2 * m) / img.width, (H - 2 * m) / img.height, 1 / dpr);
    const w = img.width * scale, h = img.height * scale;
    actions.push({ type: 'image', img, x: (W - w) / 2, y: (H - h) / 2, w, h });
    redraw();
  };
  img.src = src;
}

function readImageFile(file) {
  if (!file || !file.type.startsWith('image/')) return false;
  const r = new FileReader();
  r.onload = () => addImage(r.result);
  r.readAsDataURL(file);
  return true;
}

document.addEventListener('paste', e => {
  if (editor) return;
  for (const item of e.clipboardData.items) {
    if (readImageFile(item.getAsFile())) { e.preventDefault(); return; }
  }
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  if (!readImageFile(e.dataTransfer.files[0])) toast('That isn\'t an image');
});

// ---------- Input ----------
function point(e) {
  const r = canvas.getBoundingClientRect();
  // Pressure only means something for a stylus; mouse/trackpad get a constant width.
  const w = e.pointerType === 'pen' ? 0.4 + (e.pressure || 0.5) * 1.2 : 1;
  return { x: e.clientX - r.left, y: e.clientY - r.top, w };
}

canvas.addEventListener('pointerdown', e => {
  // Clicking away from text being typed places it.
  if (editor) { commitText(); return; }
  const p = point(e);
  if (state.tool === 'text') { openEditor(p.x, p.y); return; }
  canvas.setPointerCapture(e.pointerId);
  if (SHAPES.includes(state.tool)) {
    current = {
      type: 'shape', kind: state.tool, color: COLORS[state.color], size: SIZES[state.size],
      fill: state.fill, shift: e.shiftKey, x0: p.x, y0: p.y, x1: p.x, y1: p.y,
    };
  } else {
    current = {
      type: 'stroke', tool: state.tool, color: COLORS[state.color],
      size: SIZES[state.size] * (state.tool === 'eraser' ? 3 : 1), points: [p],
    };
  }
  redraw();
});

canvas.addEventListener('pointermove', e => {
  if (!current) return;
  if (current.type === 'shape') {
    const p = point(e);
    current.x1 = p.x; current.y1 = p.y; current.shift = e.shiftKey;
  } else {
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of evs) current.points.push(point(ev));
  }
  redraw();
});

function endStroke() {
  if (!current) return;
  if (current.type === 'shape') {
    // Bake in the Shift constraint, and drop clicks that never became a shape.
    const end = shapeEnd(current);
    Object.assign(current, { x1: end.x, y1: end.y, shift: false });
    if (Math.hypot(current.x1 - current.x0, current.y1 - current.y0) < 3) { current = null; redraw(); return; }
  }
  actions.push(current);
  current = null;
  redraw();
}
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);

// ---------- Export ----------
function contentBounds() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const a of visibleActions()) {
    if (a.tool === 'eraser') continue;
    const b = bounds(a);
    if (!b) continue;
    x0 = Math.min(x0, b[0]); y0 = Math.min(y0, b[1]);
    x1 = Math.max(x1, b[2]); y1 = Math.max(y1, b[3]);
  }
  if (x0 === Infinity) return null;
  const W = canvas.width / dpr, H = canvas.height / dpr;
  return {
    x: Math.max(0, x0 - PAD), y: Math.max(0, y0 - PAD),
    x2: Math.min(W, x1 + PAD), y2: Math.min(H, y1 + PAD),
  };
}

function send() {
  endStroke();
  commitText();
  const b = contentBounds();
  if (!b) { toast('Nothing drawn yet'); return; }
  const out = document.createElement('canvas');
  out.width = Math.round((b.x2 - b.x) * dpr);
  out.height = Math.round((b.y2 - b.y) * dpr);
  out.getContext('2d').drawImage(canvas,
    b.x * dpr, b.y * dpr, out.width, out.height, 0, 0, out.width, out.height);
  const png = out.toDataURL('image/png').split(',')[1];
  post({ action: 'send', png });
}

// ---------- UI ----------
function toast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 1200);
}

function setTool(id) {
  commitText();
  state.tool = id;
  canvas.style.cursor = id === 'text' ? 'text' : 'crosshair';
  renderBar();
}

function renderBar() {
  document.querySelectorAll('.swatch').forEach((el, i) =>
    el.classList.toggle('on', i === state.color && state.tool !== 'eraser'));
  document.querySelectorAll('[data-tool]').forEach(el =>
    el.classList.toggle('on', el.dataset.tool === state.tool));
  document.getElementById('fill').classList.toggle('on', state.fill);
  document.getElementById('size').textContent = state.size + 1;
}

const toolsEl = document.getElementById('tools');
TOOLS.forEach(t => {
  const el = document.createElement('span');
  el.className = 'btn';
  el.dataset.tool = t.id;
  el.innerHTML = `${t.name}<small>${t.key}</small>`;
  el.onclick = () => setTool(t.id);
  toolsEl.appendChild(el);
});

const sw = document.getElementById('swatches');
COLORS.forEach((c, i) => {
  const el = document.createElement('div');
  el.className = 'swatch';
  el.style.background = c;
  el.title = 'Colour ' + (i + 1);
  el.onclick = () => {
    state.color = i;
    if (state.tool === 'eraser') state.tool = 'pen';
    renderBar();
  };
  sw.appendChild(el);
});
document.getElementById('fill').onclick = () => { state.fill = !state.fill; renderBar(); };

const TOOL_KEYS = Object.fromEntries(TOOLS.map(t => [t.key.toLowerCase(), t.id]));

document.addEventListener('keydown', e => {
  const k = e.key, cmd = e.metaKey || e.ctrlKey;
  if (k === 'Shift' && current && current.type === 'shape') { current.shift = true; redraw(); return; }
  if (k === 'Enter') { e.preventDefault(); send(); }
  else if (k === 'Escape') { e.preventDefault(); post({ action: 'cancel' }); }
  else if (cmd && k.toLowerCase() === 'z') { e.preventDefault(); actions.pop(); redraw(); }
  // The host has no Edit menu, so ⌘V may never become a paste event; ask Hammerspoon too.
  else if (cmd && k.toLowerCase() === 'v') { post({ action: 'paste' }); }
  else if (cmd) return;
  else if (k === 'Backspace' || k === 'Delete') {
    if (visibleActions().length) { actions.push({ type: 'clear' }); redraw(); }
  }
  else if (TOOL_KEYS[k.toLowerCase()]) setTool(TOOL_KEYS[k.toLowerCase()]);
  else if (k === 'f' || k === 'F') state.fill = !state.fill;
  else if (k === '[') state.size = Math.max(0, state.size - 1);
  else if (k === ']') state.size = Math.min(SIZES.length - 1, state.size + 1);
  else if (k >= '1' && k <= String(COLORS.length)) {
    state.color = +k - 1;
    if (state.tool === 'eraser') state.tool = 'pen';
  }
  else return;
  renderBar();
});
document.addEventListener('keyup', e => {
  if (e.key === 'Shift' && current && current.type === 'shape') { current.shift = false; redraw(); }
});

window.addEventListener('resize', resize);
setTool('pen');
resize();
</script>
</body>
</html>
